apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomization이 관리할 리소스 목록을 정의
resources:
- hello-app-namespace.yaml
- hello-app-deployment.yaml
- hello-app-service.yaml
images:
- name: myanjini/hello-app
  newName: myanjini/hello-app
  newTag: 8420b2e
- name: yuniqcoding/hello-app
  newName: docker.io/yuniqcoding/hello-app
  newTag: 9addc5b
